services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    container_name: malikauth-dev
    ports:
      - "3000:3000"
    env_file:
      - .env.development
    environment:
      - NODE_ENV=development
    volumes:
      - ./src:/app/src
      - ./server.ts:/app/server.ts
      - ./package.json:/app/package.json
    networks:
      - malikauth-net
    depends_on:
      - firebase-config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: malikauth-prod
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - malikauth-net
    depends_on:
      - firebase-config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  firebase-config:
    image: alpine:latest
    container_name: malikauth-firebase
    volumes:
      - firebase-data:/app
    networks:
      - malikauth-net

networks:
  malikauth-net:
    driver: bridge

volumes:
  firebase-data:
    driver: local
